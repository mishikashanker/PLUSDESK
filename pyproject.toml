[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedesk"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1",
  "slack-bolt>=1.21,<2", "aiohttp>=3.10,<4", "pydantic-settings>=2.6,<3",
  "httpx[socks]>=0.27,<1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx[socks]>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
app = ["static/*"]
